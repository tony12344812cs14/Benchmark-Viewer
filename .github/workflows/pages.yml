name: Build MMLU data and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "pandas>=2,<3" pyarrow huggingface_hub

      - name: Cache downloaded datasets
        uses: actions/cache@v4
        with:
          path: hf_data
          key: hf-data-routerbench0shot-mmlu-v1

      - name: Download RouterBench and original MMLU
        run: |
          python - <<'EOF'
          from huggingface_hub import hf_hub_download, snapshot_download
          hf_hub_download(repo_id="withmartian/routerbench", filename="routerbench_0shot.pkl",
                          repo_type="dataset", local_dir="hf_data/routerbench")
          snapshot_download(repo_id="cais/mmlu", repo_type="dataset",
                            allow_patterns=["all/*"], local_dir="hf_data/mmlu")
          EOF

      - name: Convert to viewer JSON
        run: |
          mkdir -p _site/data
          python routerbench_to_json.py hf_data/routerbench/routerbench_0shot.pkl \
            --mmlu-dir hf_data/mmlu -o _site/data/mmlu.json
          cp index.html README.md routerbench_to_json.py _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
